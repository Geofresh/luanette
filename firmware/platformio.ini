; PlatformIO wrapper around the ESP-IDF project (the same sources and sdkconfig defaults as idf.py):
;   pio run -t upload
[platformio]
src_dir = main

[env:amoled-206]
platform = espressif32 @ 7.1.3  ; ESP-IDF 6.1
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles =
    ../engine/builtin/launcher.lua
    ../examples/lockload.lua
    ../examples/bubbles.lua
    ../examples/night_swarm.lua
    ../examples/dice.lua
    ../examples/mochi.lua
