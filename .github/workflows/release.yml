name: release

# Push a tag like v0.1.0: the firmware is built and its four parts are attached to a GitHub
# release, flashed with
#   esptool --chip esp32s3 write-flash 0x0 bootloader.bin 0x8000 partitions.bin \
#     0x19000 ota_data_initial.bin 0x20000 luanette.bin
# Four files, not one merged image: merging fills the gaps between them, and NVS (0x9000-0x19000:
# saves, the timezone, anything another firmware keeps there) is one of those gaps, so a merged
# image erases it. Written separately, each part only erases its own sectors.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write  # to run pages.yml, which puts the new firmware behind the playground's Install button

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio==6.2.0
      - run: PROJECT_VER="${GITHUB_REF_NAME#v}" pio run -d firmware
      - run: |
          mkdir out
          cd firmware/.pio/build/amoled-206
          cp bootloader.bin partitions.bin ota_data_initial.bin "$GITHUB_WORKSPACE/out/"
          cp firmware.bin "$GITHUB_WORKSPACE/out/luanette.bin"
      - run: gh release create "$GITHUB_REF_NAME" out/*.bin --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      # A release made with this workflow's token doesn't start other workflows on its own.
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
