name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    # The engine on a desktop: unit tests, every example and the launcher through check.py, and the
    # parity test (check.py against the device runtime, pixel for pixel).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python tools/build_lupa32.py
      - run: cmake -S host -B host/build && cmake --build host/build -j
      - run: host/build/host_tests
      - run: python tools/gallery_index.py gallery /tmp/gallery.json  # names and headers
      - run: python tools/share_link.py --check docs/tutorial.md .  # its links open its step carts
      - run: for c in examples/*.lua gallery/*.lua templates/*.lua tests/tutorial/*.lua libs/demos/*.lua engine/builtin/launcher.lua; do python tools/check.py "$c" > /dev/null || { python tools/check.py "$c"; exit 1; }; done
      - run: for c in tests/carts/primitives.lua tests/carts/triangles.lua tests/carts/lazy.lua tests/carts/sounds.lua tests/carts/log.lua tests/carts/sprites.lua tests/carts/map.lua tests/carts/api.lua tests/carts/sprites2.lua; do python tests/parity.py "$c"; done
      - run: python tests/extra.py  # a port's own calls (Host::extra_api, check.py's EXTRA) reach a cart alike
      - run: python tools/check.py tests/carts/api.lua > /tmp/api.json && python tools/api_check.py /tmp/api.json  # every name documented

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini', 'firmware/main/idf_component.yml') }}
      - run: pip install platformio==6.2.0
      - run: pio run -d firmware

  cli:
    # The command-line tool (cli/, npm "luanette"): the engine built for Node, every cart in the
    # repository through its check, a run and a song, and the package as it would be published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: web/build.sh
      - run: cli/build.sh
      - run: for c in examples/*.lua gallery/*.lua templates/*.lua tests/tutorial/*.lua libs/demos/*.lua; do node cli/luanette.mjs check "$c" > /dev/null || { node cli/luanette.mjs check "$c"; exit 1; }; done
      - run: node cli/luanette.mjs run templates/platformer.lua --frames 60 --gif --out /tmp/run && test -s /tmp/run/run.gif && test -s /tmp/run/shots.png
      - run: node cli/luanette.mjs song examples/overdrive.lua --wav /tmp/song.wav && test -s /tmp/song.wav
      - run: |  # the MCP server: it answers, lists its tools, and checks a cart
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"check_cart","arguments":{"path":"templates/puzzle.lua"}}}' \
            | node cli/luanette.mjs mcp > /tmp/mcp.out
          grep -q '"name":"run_cart"' /tmp/mcp.out && grep -q '\\"ok\\": true' /tmp/mcp.out
      - run: |  # each library's demo holds the library as it is in libs/ (add puts it there, and changes nothing now)
          for d in libs/demos/*.lua; do node cli/luanette.mjs add "$(basename "$d" .lua)" "$d" > /dev/null; done
          git diff --exit-code libs/demos
      - run: node cli/luanette.mjs check tests/carts/api.lua > /tmp/api.json && python3 tools/api_check.py /tmp/api.json  # the same names as check.py
      - run: cd cli && npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: luanette-npm
          path: cli/luanette-*.tgz
